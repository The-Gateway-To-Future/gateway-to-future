<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Gateway To Future</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      line-height: 1.55;
      color: #475569;
      margin: 0 0 22px;
    }
    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Gateway To Future · Berlin</div>
    <h1>You Are Offline</h1>
    <p>No active internet connection was detected. Your local study progress is preserved — reconnect to Wi-Fi or mobile data and retry.</p>
    <button type="button" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
