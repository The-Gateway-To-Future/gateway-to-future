<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff;">
  <!-- GTF Monogram Main Group -->
  <g transform="translate(180, 50)">
    <!-- G Letter -->
    <path d="M 280 50 C 130 50 40 140 40 280 C 40 420 130 510 280 510 C 370 510 440 460 470 380 L 330 380 L 330 300 L 570 300 L 570 320 C 560 480 440 590 280 590 C 100 590 -40 450 -40 270 C -40 90 100 -30 280 -30 L 400 -30 L 400 50 Z" transform="scale(0.65)" fill="#111827"/>
    
    <!-- T Letter -->
    <path d="M 310 32 H 520 V 96 H 450 V 380 H 380 V 96 H 310 Z" fill="#111827"/>

    <!-- F Letter with German Flag Top Slanted Bar -->
    <path d="M 520 32 H 710 V 96 H 590 V 210 H 700 V 270 H 590 V 380 H 520 Z" fill="#111827"/>

    <!-- German Flag Slanted Accent (Black, Red, Gold) -->
    <!-- Black Stripe -->
    <polygon points="590,32 640,0 700,0 650,32" fill="#000000"/>
    <!-- Red Stripe -->
    <polygon points="655,32 705,0 765,0 715,32" fill="#DD0000"/>
    <!-- Gold Stripe -->
    <polygon points="720,32 770,0 840,0 790,32" fill="#FFCC00"/>
  </g>

  <!-- GATEWAY TO FUTURE Text -->
  <text x="500" y="440" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="12" text-anchor="middle">
    <tspan fill="#111827">GATEWAY </tspan>
    <tspan fill="#e11d48">TO </tspan>
    <tspan fill="#111827">FUTURE</tspan>
  </text>

  <!-- Tagline & Underlines -->
  <g transform="translate(500, 490)">
    <!-- Left Underline -->
    <line x1="-380" y1="-10" x2="-260" y2="-10" stroke="#111827" stroke-width="4"/>
    
    <!-- Tagline Text -->
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="26" font-weight="600" fill="#1f2937" letter-spacing="2" text-anchor="middle">Creating Career Without Borders</text>
    
    <!-- Right German Flag Underline -->
    <line x1="260" y1="-10" x2="310" y2="-10" stroke="#000000" stroke-width="4"/>
    <line x1="310" y1="-10" x2="350" y2="-10" stroke="#DD0000" stroke-width="4"/>
    <line x1="350" y1="-10" x2="390" y2="-10" stroke="#FFCC00" stroke-width="4"/>
  </g>
</svg>
