name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend Tests (informational – does NOT block deploy)
  # ──────────────────────────────────────────────
  test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    continue-on-error: true          # ← backend failures don't block Pages deploy
    env:
      DB_MOCK: "true"
      REDIS_MOCK: "true"
      PAY_MOCK: "true"
      JWT_SECRET: "test_jwt_secret_999"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test

      - name: Build backend (TypeScript compile)
        run: cd backend && npm run build

  # ──────────────────────────────────────────────
  # Job 2: Build React CRM Dashboard + Deploy
  # Runs independently of backend tests
  # ──────────────────────────────────────────────
  deploy:
    name: Build React App & Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build React CRM Dashboard
        run: cd frontend && npm run build

      # Vite builds to frontend/dist/ with base=/app/
      # Copy into /app/ at the repo root so Pages serves it at /app/
      - name: Place React build at /app/
        run: |
          mkdir -p app
          cp -r frontend/dist/. app/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload entire project root:
      #   /           → index.html (static landing page)
      #   /ausbildung.html → static Ausbildung Hub
      #   /courses.html    → static Courses
      #   /app/            → React CRM Dashboard (Vite build)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
