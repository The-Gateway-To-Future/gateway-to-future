name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend Tests (always run)
  # ──────────────────────────────────────────────
  test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    env:
      DB_MOCK: "true"
      REDIS_MOCK: "true"
      PAY_MOCK: "true"
      JWT_SECRET: "test_jwt_secret_999"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Build backend
        run: |
          cd backend
          npm run build

  # ──────────────────────────────────────────────
  # Job 2: Build & Deploy – Static + React CRM App
  # ──────────────────────────────────────────────
  deploy:
    name: Build React App & Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build React CRM Dashboard
        run: |
          cd frontend
          npm run build

      # The Vite build outputs to frontend/dist/ with base=/app/
      # We copy the dist/ folder into the root as app/
      # so GitHub Pages serves it at gatewaytofuture.com/app/
      - name: Move React build into /app folder at root
        run: |
          mkdir -p app
          cp -r frontend/dist/* app/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload the entire project root as the Pages artifact
      # This means:
      #   / → index.html (static landing page)
      #   /ausbildung.html → Ausbildung Hub (static)
      #   /courses.html → Courses static page
      #   /app/ → React CRM Dashboard (built by Vite)
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
